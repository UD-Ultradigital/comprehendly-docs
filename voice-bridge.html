<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comprehendly voice bridge</title>
    <style>
      html, body { margin: 0; height: 100%; }
      iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe
      id="fill"
      title="Comprehendly fill"
      allow="microphone *; camera *; clipboard-write *; autoplay *"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    ></iframe>
    <script>
      (function () {
        var q = new URLSearchParams(location.search)
        var token = q.get('integration_token') || ''
        var pageId = q.get('page_id') || ''
        var mode = q.get('fill_mode') || q.get('mode') || 'assistant'
        var base = (q.get('base_url') || 'https://sdk.comprehendly.nz').replace(/\/$/, '')
        if (!token || !pageId) {
          document.body.textContent = 'Missing integration_token or page_id'
          return
        }
        var params = new URLSearchParams()
        params.set('integration_token', token)
        params.set('page_id', pageId)
        params.set('fill_mode', mode)
        var origin = new URL(base).origin
        var iframe = document.getElementById('fill')
        iframe.src = base + '/embed/forms/fill?' + params.toString()

        function toNative(payload) {
          try {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.comprehendly) {
              window.webkit.messageHandlers.comprehendly.postMessage(payload)
            }
          } catch (e) {}
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, '*')
          }
        }

        window.addEventListener('message', function (event) {
          if (event.origin !== origin) return
          var data = event.data
          if (!data || typeof data !== 'object') return
          toNative(data)
        })
      })()
    </script>
  </body>
</html>
